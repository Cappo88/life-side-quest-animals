<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#DCE0C8">
<title>今天遇见猫咪了吗</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">

<style>
/* 🌟 所有 CSS 直接内联，杜绝手机加载失败 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --paper: #DCE0C8; --ink: #2B3A21; --ink2: #5C6B52; --orange: #465B36; 
  --orangeL: #C8D1B0; --line: #A6B591; --white: #F5F6EE;        
}
html,body{height:100%;}
body{
  font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "PingFang SC", "Microsoft YaHei", sans-serif;
  background-color: var(--paper); color: var(--ink); -webkit-font-smoothing:antialiased; 
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
}
.app{
  position:relative; z-index:1; max-width:520px; margin:0 auto; padding:0 20px 48px; min-height:100%;
  background: rgba(253, 247, 238, 0.4);
  box-shadow: -2px 0 10px rgba(0,0,0,0.05), 2px 0 10px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.05);
  overflow-x: hidden; 
}
.view{display:none;}
.view.active{display:block; animation: simpleFade 0.3s ease-out;}
@keyframes simpleFade { from { opacity: 0; } to { opacity: 1; } }

.task-chip{ display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em; color:var(--ink);background:var(--orangeL); padding:6px 14px;border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.task-chip.done{color:var(--white);background:var(--orange);}

.btn-main{
  width:100%;border: 2px solid var(--ink);border-radius:15px 25px 20px 30px / 30px 20px 25px 15px;
  padding:16px; background:var(--orange);color:var(--white);font-size:18px;font-weight:700;letter-spacing:.04em;
  font-family:inherit;cursor:pointer; box-shadow: 4px 4px 0 var(--ink); transition:transform .1s, box-shadow .1s;
}
.btn-main:active{transform:translate(4px, 4px);box-shadow: 0 0 0 var(--ink);}

.link-btn{ background:none;border:none;color:var(--ink2);font-size:15px;font-weight:600; font-family:inherit;cursor:pointer;padding:8px;text-decoration:none; border-bottom: 2px dashed var(--line); }

.home-top{padding:44px 0 0;}
.home-title{margin-top:20px;font-size:42px;line-height:1.2;font-weight:800;letter-spacing:-.01em; text-shadow: 1px 1px 0 var(--white);}
.home-title em{font-style:normal;color:var(--orange);position:relative;display:inline-block;}
.home-sub{margin-top:14px;color:var(--ink2);font-size:16px;letter-spacing:.05em;}

.paw-stage{position:relative;height:250px;display:flex;align-items:center;justify-content:center;margin:10px 0 0;}
.paw-ring-outer{position:absolute; width:250px; height:250px; border-radius:50%; border:2px dashed var(--line); animation:spin 35s linear infinite;}
.paw-ring-inner{position:absolute; width:190px; height:190px; animation:spin-reverse 28s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes spin-reverse{to{transform:rotate(-360deg);}}

.paw-icon{position:relative; z-index:2; animation:pawFloat 3.2s ease-in-out infinite;}
@keyframes pawFloat{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}

.home-foot{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.stat{font-size:14px;color:var(--ink2);letter-spacing:.03em;}
.stat b{color:var(--orange);font-size:18px;font-weight:800;margin:0 2px;}

#view-analyzing{padding-top:80px;}
.scan-wrap{position:relative;border-radius:15px 25px 20px 30px / 30px 20px 25px 15px;overflow:hidden;border: 2px solid var(--ink);box-shadow: 4px 4px 0 var(--ink);aspect-ratio:1/1;background:var(--orangeL);}
.scan-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.scan-line{position:absolute;left:0;right:0;height:4px;background:var(--orange);opacity:0.6;animation:scan 1.9s ease-in-out infinite;}
@keyframes scan{0%{top:0;opacity:0;}12%{opacity:1;}88%{opacity:1;}100%{top:100%;opacity:0;}}
.analyzing-text{margin-top:34px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600;color:var(--ink2);letter-spacing:.03em;}
.dot-pulse{width:10px;height:10px;border-radius:50%;background:var(--orange);animation:dotPulse 1.2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{transform:scale(.6);opacity:.4;}50%{transform:scale(1.15);opacity:1;}}

.result-head{padding:40px 0 16px;}

/* 🌟 多图横向滑动相册（图片缩小，居中留白） */
.photo-gallery-scroll {
  width: calc(100% + 40px); 
  margin-left: -20px; 
  overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 10px 20px 20px; 
  -webkit-overflow-scrolling: touch;
}
.photo-gallery-scroll::-webkit-scrollbar { display: none; }
.photo-gallery-track { display: flex; gap: 15px; }
.photo-gallery-track .photo-card {
  min-width: 260px; 
  max-width: 300px;
  flex-shrink: 0; scroll-snap-align: center;
  position:relative; border-radius:4px; overflow:hidden; border: 8px solid var(--white); 
  box-shadow: 0 4px 15px rgba(0,0,0,0.15), 2px 2px 0 var(--line); aspect-ratio:1/1; background:var(--orangeL);
  transform: rotate(-1deg); 
}
.photo-gallery-track .photo-card img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-stamp{position:absolute;right:10px;bottom:10px;background:var(--white);color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.1em;padding:5px 10px;border-radius:99px;border: 1.5px solid var(--orange); transform: rotate(-5deg); box-shadow: 2px 2px 0 rgba(0,0,0,0.1);}
.del-photo-btn {
  position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9);
  border: 1.5px solid var(--orange); color: var(--orange); width: 28px; height: 28px;
  border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center;
  z-index: 10; cursor: pointer; box-shadow: 2px 2px 0 rgba(0,0,0,0.1); font-size: 14px;
}
.add-photo-card {
  min-width: 260px; max-width: 300px; border: 2px dashed var(--line); border-radius: 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--white); color: var(--ink2); cursor: pointer; aspect-ratio: 1/1;
  flex-shrink: 0; scroll-snap-align: center; box-shadow: 2px 2px 0 var(--line);
}

.breed-card{margin-top:18px;background:var(--white);border: 2px solid var(--ink);border-radius:15px 25px 20px 30px / 30px 20px 25px 15px;padding:22px;box-shadow: 3px 3px 0 var(--line);}
.breed-label{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--ink2);opacity:.65;}
.section-title{margin:30px 0 4px;font-size:16px;font-weight:800;letter-spacing:.05em;color:var(--ink);display:flex;align-items:center;gap:7px;}
.chip-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.chip{ padding:8px 15px;border-radius:15px 5px 15px 5px / 5px 15px 5px 15px; font-size:14px;font-weight:600;background:var(--white);border:1.5px solid var(--line);color:var(--ink); cursor:pointer;font-family:inherit;transition:.15s;box-shadow: 1.5px 1.5px 0 var(--line); }
.chip.on{background:var(--orange);border-color:var(--ink);color:var(--white);box-shadow: 2px 2px 0 var(--ink);transform:translate(-1px, -1px);}
.chip:active{transform:translate(1px, 1px);box-shadow: 0 0 0 var(--line);}
.text-input{ width:100%;margin-top:12px;padding:14px 17px;border-radius:10px 15px 10px 15px / 15px 10px 15px 10px; border:1.5px solid var(--ink);background:var(--white); font-size:15px;font-family:inherit;color:var(--ink);outline:none;transition:border-color .2s;box-shadow: inset 1px 1px 3px rgba(0,0,0,0.05); }
.text-input::placeholder{color:#9DAE8B;font-style:italic;}
.text-input:focus{border-color:var(--orange);}

.notes-history-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.note-history-item { background: var(--white); padding: 10px 14px; border-radius: 8px; font-size: 14px; border: 1px dashed var(--line); color: var(--ink); position: relative; box-shadow: 2px 2px 0 rgba(0,0,0,0.02); line-height: 1.5; }
.note-history-date { display: block; font-size: 11px; color: var(--ink2); margin-top: 4px; font-style: italic; }

.back-btn{background:none;border:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink2);cursor:pointer;padding:40px 0 0;transition:.2s;}
.back-btn:hover{color:var(--orange);}
.gallery-title{margin-top:22px;font-size:30px;font-weight:800;color:var(--ink);}
.gallery-sub{margin-top:7px;font-size:14px;color:var(--ink2);}
.corkboard-wrap{ margin-top: 16px; height: 90px; background-color: #C3D0B0; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 4px); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 4px 4px 0 var(--ink); overflow: hidden; position: relative; display: flex; align-items: center; }
.corkboard-track{display: flex; white-space: nowrap; animation: marquee 25s linear infinite; padding-left: 20px;}
.corkboard-track:hover { animation-play-state: paused; }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.voice-note { display: inline-flex; align-items: center; justify-content: center; background: var(--white); margin-right: 25px; padding: 8px 16px; color: var(--ink); font-weight: 700; transform-origin: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.15); position: relative; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }

.gallery-list{margin-top:22px;display:flex;flex-direction:column;gap:16px;}
.gal-item{position:relative; display:flex; gap:14px; background:var(--white); border:2px solid var(--ink); border-radius:15px 20px 15px 20px / 20px 15px 20px 15px; padding:14px; padding-right: 40px; box-shadow: 3px 3px 0 var(--line); animation:viewIn .5s cubic-bezier(.2,.8,.3,1) backwards; transition: border-color 0.5s ease, box-shadow 0.5s ease;}
.gal-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;}
.gal-name{font-size:17px;font-weight:800;color:var(--ink);}
.gal-meta{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px;}
.gal-meta span{background:var(--paper);padding:3px 9px;border-radius:6px;font-weight:600;border:1px solid var(--line);}
.gal-date{font-size:12px;color:#7A8A69;font-weight:600;letter-spacing:.03em;}

.del-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--line); color: var(--ink2); font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; box-shadow: 1px 1px 0 var(--line); }
.del-btn:hover { background: #FFE5E5; color: var(--orange); border-color: var(--orange); }

.empty{text-align:center;padding:70px 20px;color:var(--ink2);}
.empty-emoji{font-size:50px;opacity:.8;display:block;margin-bottom:14px;filter: sepia(50%);}
.empty p{font-size:15px;line-height:1.7;}

.input-with-btn { position: relative; width: 100%; margin-top: 12px; }
.input-with-btn .text-input { margin-top: 0; padding-right: 70px; }
.add-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--orangeL); color: var(--orange); border: 1.5px solid var(--orange); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s ease; opacity: 0; pointer-events: none; }
.input-with-btn.has-value .add-btn { opacity: 1; pointer-events: auto; }
.add-btn:active { transform: translateY(-50%) scale(0.92); background: var(--orange); color: var(--white); }

.toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;padding:12px 24px;border-radius:8px;z-index:99;opacity:0;pointer-events:none;transition:.32s cubic-bezier(.2,.8,.3,1);box-shadow: 2px 2px 0 rgba(0,0,0,0.2);white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}

.floating-save {
  position: fixed !important; display: none !important; right: 20px !important;
  bottom: calc(30px + env(safe-area-inset-bottom, 0px)) !important; width: auto !important;
  min-width: 140px !important; padding: 12px 24px !important; border-radius: 999px !important;
  font-size: 16px !important; z-index: 999999 !important; border: 2px solid var(--ink) !important;
  box-shadow: 4px 4px 0 var(--ink) !important; transition: transform 0.1s, box-shadow 0.1s !important;
  background: var(--orange) !important; color: var(--white) !important; font-weight: bold !important;
  transform: translateZ(0) !important; 
}
.floating-save:active { transform: translate(4px, 4px) translateZ(0) !important; box-shadow: 0 0 0 var(--ink) !important; }
#view-result { padding-bottom: 150px; }
body.view-result .floating-save { display: block !important; }

.custom-modal-overlay { position: fixed; inset: 0; background: rgba(42, 37, 32, 0.4); backdrop-filter: blur(4px); z-index: 99999; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; }
.custom-modal-overlay.show { opacity: 1; pointer-events: auto; }
.custom-modal-box { background: var(--white); border: 2.5px solid var(--ink); border-radius: 15px 25px 20px 30px / 30px 20px 25px 15px; padding: 24px 20px; width: 85%; max-width: 340px; box-shadow: 6px 6px 0 var(--ink); transform: translateY(20px) scale(0.95); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1); }
.custom-modal-overlay.show .custom-modal-box { transform: translateY(0) scale(1); }
.custom-modal-text { font-size: 16px; font-weight: 700; color: var(--ink); text-align: center; line-height: 1.6; margin-bottom: 24px; }
.custom-modal-actions { display: flex; flex-direction: column; gap: 12px; }
.btn-modal-confirm { background: var(--ink); color: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 12px; font-size: 15px; font-weight: bold; font-family: inherit; cursor: pointer; box-shadow: 3px 3px 0 var(--line); transition: all 0.1s; }
.btn-modal-confirm:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--line); }
.btn-modal-cancel { background: var(--orangeL); color: var(--orange); border: 2px solid var(--orange); border-radius: 12px; padding: 12px; font-size: 15px; font-weight: bold; font-family: inherit; cursor: pointer; box-shadow: 3px 3px 0 var(--line); transition: all 0.1s; }
.btn-modal-cancel:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--line); }

.hand-checkbox { display: flex; align-items: center; user-select: none; position: relative; }
.hand-checkbox .box { display: inline-flex; justify-content: center; align-items: center; width: 22px; height: 22px; border: 2.5px solid var(--ink); border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; background: var(--white); margin-right: 10px; position: relative; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
.hand-checkbox .box svg { width: 24px; height: 24px; stroke: var(--orange); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; position: absolute; top: -3px; left: -3px; }
.hand-checkbox .box svg path { stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset 0.4s cubic-bezier(0.2, 0.8, 0.3, 1); }
.hand-checkbox .box.active { background: var(--orangeL); transform: rotate(-4deg) scale(1.05); }
.hand-checkbox .box.active svg path { stroke-dashoffset: 0; }
.hand-checkbox .text { font-size: 16px; font-weight: 800; letter-spacing: .05em; color: var(--ink); transition: color 0.2s; }
.loc-icon { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; vertical-align: -2px; margin-right: 3px; }

.deco-bottom { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; z-index: 0; pointer-events: none; opacity: 0.9; object-fit: contain; }
.deco-left { left: -15px; }
.deco-right { right: -15px; }

/* 分享海报弹窗样式 */
.share-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.share-overlay.show { opacity: 1; pointer-events: auto; }
.share-tip { color: #fff; font-size: 16px; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px; }
.share-img-container { width: 85%; max-width: 400px; max-height: 70vh; overflow-y: auto; border-radius: 12px; background: #fff; padding: 10px; }
.share-img-container img { width: 100%; display: block; border-radius: 8px; }
.share-close-btn {
  margin-top: 20px; background: none; border: 1.5px solid #fff; color: #fff;
  padding: 8px 24px; border-radius: 99px; font-size: 15px; cursor: pointer;
}
</style>
</head>
<body>

<div class="app">
  <section id="view-home" class="view active">
    <div class="home-top"><span class="task-chip">支线任务 · 日常</span></div>
    <h1 class="home-title">今天遇见<br><em>猫咪了吗</em></h1>
    <p class="home-sub">随手记录你偶遇的动物伙伴</p>
    
    <div class="paw-stage">
      <div class="paw-ring-outer"></div>
      <div class="paw-ring-inner">
        <svg width="190" height="190" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 50 10 A 10 10 0 0 1 70 15.3 A 10 10 0 0 1 84.6 30 A 10 10 0 0 1 90 50 A 10 10 0 0 1 84.6 70 A 10 10 0 0 1 70 84.6 A 10 10 0 0 1 50 90 A 10 10 0 0 1 30 84.6 A 10 10 0 0 1 15.4 70 A 10 10 0 0 1 10 50 A 10 10 0 0 1 15.4 30 A 10 10 0 0 1 30 15.3 A 10 10 0 0 1 50 10 Z" fill="#CDD3B4" stroke="#3A4A2C" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="paw-icon">
        <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="45" cy="45" r="40" fill="#3A4A2C" />
          <line x1="75" y1="75" x2="96" y2="96" stroke="#3A4A2C" stroke-width="14" stroke-linecap="round" />
          <path d="M 22 18 L 33 30 C 40 26, 50 26, 57 30 L 68 18 L 78 45 C 80 65, 65 75, 45 75 C 25 75, 10 65, 12 45 Z" fill="#F5F6EE" />
          <ellipse cx="32" cy="46" rx="4" ry="7" fill="#3A4A2C" />
          <ellipse cx="58" cy="46" rx="4" ry="7" fill="#3A4A2C" />
          <path d="M 42 55 L 48 55 L 45 59 Z" fill="#3A4A2C" />
          <path d="M 38 63 Q 41.5 67 45 62 Q 48.5 67 52 63" stroke="#3A4A2C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
    
    <button class="btn-main" id="btn-start" style="line-height: 1.2; padding: 16px 20px;">
      <span style="font-size: 20px; font-weight: bold; display: block; margin-bottom: 6px;">今天会遇见谁呢？</span>
      <span style="font-size: 13px; font-weight: 500; opacity: 0.85;">上传照片 / 拍照</span>
    </button>
    
    <div class="home-foot">
      <div class="stat">已收录 <b id="stat-count">0</b> 只动物伙伴</div>
      <button class="link-btn" id="btn-gallery">我的动物图鉴 →</button>
    </div>
  </section>

  <section id="view-analyzing" class="view">
    <div class="scan-wrap">
      <img id="scan-img" alt="">
      <div class="scan-line"></div>
    </div>
    <div class="analyzing-text">
      <span class="dot-pulse"></span>
      <span id="analyzing-msg">正在准备手账…</span>
    </div>
  </section>

  <section id="view-result" class="view">
    <div class="result-head" style="display: flex; align-items: center; justify-content: space-between; padding: 30px 0 16px;">
      <button class="back-btn" id="btn-back-result" style="padding: 0; font-size: 14.5px; font-weight: 600; color: var(--ink2); cursor: pointer; border: none; background: none; font-family: inherit;">← 返回</button>
      <span class="task-chip done" id="result-status-chip">✓ 记录完成</span>
    </div>
    
    <div class="photo-gallery-scroll">
      <div class="photo-gallery-track" id="result-photos-container"></div>
    </div>
    
    <div style="text-align: right; margin-top: 8px;">
      <button id="btn-download" style="background: none; border: none; color: var(--ink2); font-size: 13px; font-family: inherit; cursor: pointer; text-decoration: underline; border-bottom: 1px dashed var(--line);">保存当前主图</button>
    </div>

    <div class="breed-card" style="padding: 20px; margin-top: 12px;">
      <div class="breed-label" style="margin-bottom: 8px;">这是谁？</div>
      <input class="text-input" id="animal-name" placeholder="比如：三花猫、小黑狗、大熊猫…" maxlength="12" style="margin-top: 0; font-size: 18px; font-weight: bold;">
      <div style="font-size: 12px; color: var(--ink2); margin-top: 8px; opacity: 0.7;">随心记录</div>
    </div>

    <div class="section-title">
      <div class="hand-checkbox" id="check-location">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">在哪里遇见？</span>
      </div>
    </div>
    <div class="chip-row" id="location-chips"></div>
    <input class="text-input" id="location-input" placeholder="或者，自己填一个地点…" maxlength="20">

    <div class="section-title">
      <div class="hand-checkbox" id="check-personality">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">它的性格</span>
      </div>
      <button class="refresh-btn" id="btn-refresh-personality" style="margin-left: auto; background: none; border: none; color: var(--orange); font-size: 13px; cursor: pointer;">换一批</button>
    </div>
    <div class="chip-row" id="personality-chips"></div>
    <div class="input-with-btn">
      <input class="text-input" id="personality-input" placeholder="输入你想加的词…" maxlength="16">
      <button class="add-btn" id="btn-add-personality" type="button">+ 添加</button>
    </div>

    <div class="section-title">
      <div class="hand-checkbox" id="check-voice">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">它的声音</span>
      </div>
      <button class="refresh-btn" id="btn-refresh-voice" style="margin-left: auto; background: none; border: none; color: var(--orange); font-size: 13px; cursor: pointer;">换一批</button>
    </div>
    <div class="chip-row" id="voice-chips"></div>
    <div class="input-with-btn">
      <input class="text-input" id="voice-input" placeholder="输入你想加的词…" maxlength="16">
      <button class="add-btn" id="btn-add-voice" type="button">+ 添加</button>
    </div>

    <div class="section-title">
      <div class="hand-checkbox" id="check-appetite">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">饭量如何？</span>
      </div>
      <button class="refresh-btn" id="btn-refresh-appetite" style="margin-left: auto; background: none; border: none; color: var(--orange); font-size: 13px; cursor: pointer;">换一批</button>
    </div>
    <div class="chip-row" id="appetite-chips"></div>
    <div class="input-with-btn">
      <input class="text-input" id="appetite-input" placeholder="输入你想加的词…" maxlength="16">
      <button class="add-btn" id="btn-add-appetite" type="button">+ 添加</button>
    </div>

    <div class="section-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#465B36" style="vertical-align: -3px; margin-right: 2px;" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span class="text">初见印象以及你最爱的特征</span>
      <button class="refresh-btn" id="btn-refresh-vibe" style="margin-left: auto; background: none; border: none; color: var(--orange); font-size: 13px; cursor: pointer;">换一批</button>
    </div>
    <div class="chip-row" id="vibe-chips"></div>
    <div class="input-with-btn">
      <input class="text-input" id="vibe-input" placeholder="输入你想加的词…" maxlength="16">
      <button class="add-btn" id="btn-add-vibe" type="button">+ 添加</button>
    </div>

    <div class="section-title">
      <div class="hand-checkbox" id="check-notes">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">你想对 TA 说的话</span>
      </div>
    </div>
    <div id="notes-history" class="notes-history-box" style="display: none;"></div>
    <input class="text-input" id="notes-input" placeholder="在这里写下新的话…" maxlength="50">

    <!-- 🌟 已删除修改记录面板 -->

    <div style="margin-top: 50px; margin-bottom: 100px; text-align: center;">
      <button id="btn-again" style="background: none; border: none; color: var(--ink2); font-size: 14px; font-family: inherit; cursor: pointer; text-decoration: underline; opacity: 0.7;">放弃当前内容并开启新图鉴</button>
    </div>
  </section>

  <section id="view-gallery" class="view">
    <button class="back-btn" id="btn-back">← 返回</button>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 class="gallery-title" style="margin-top: 22px;">我的动物图鉴</h2>
      <button id="btn-share-gallery" style="background: var(--white); border: 1.5px solid var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: bold; box-shadow: 2px 2px 0 var(--line); cursor: pointer; color: var(--ink);">生成海报</button>
    </div>
    <div class="gallery-sub" id="gallery-sub">还没有记录</div>
    
    <div class="corkboard-wrap" id="corkboard-wrap">
      <div class="corkboard-track" id="corkboard-track"></div>
    </div>

    <div class="gallery-list" id="gallery-list"></div>
  </section>
</div>

<button class="btn-main floating-save" id="btn-save">收进图鉴</button>

<img src="plant.png" class="deco-bottom deco-left" alt="" onerror="this.style.display='none'">
<img src="cat.png" class="deco-bottom deco-right" alt="" onerror="this.style.display='none'">

<input type="file" id="file-input" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<div class="share-overlay" id="share-overlay">
  <div class="share-tip">长按下方图片保存到手机相册 👇</div>
  <div class="share-img-container">
    <img id="share-image" src="" alt="分享海报">
  </div>
  <button class="share-close-btn" id="btn-close-share">关闭</button>
</div>

<script src="breeds.js"></script>
<script src="app.js"></script>
</body>
</html>
