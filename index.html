<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#DCE0C8">
<title>今天遇见猫咪了吗</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <section id="view-home" class="view active">
    <div class="home-top"><span class="task-chip">支线任务 · 日常</span></div>
    <h1 class="home-title">今天遇见<br><em>猫咪了吗</em></h1>
    <p class="home-sub">随手记录你偶遇的动物伙伴</p>
    
    <div class="paw-stage">
      <div class="paw-ring-outer"></div>
      <div class="paw-ring-inner">
        <svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 50 10 A 10 10 0 0 1 70 15.3 A 10 10 0 0 1 84.6 30 A 10 10 0 0 1 90 50 A 10 10 0 0 1 84.6 70 A 10 10 0 0 1 70 84.6 A 10 10 0 0 1 50 90 A 10 10 0 0 1 30 84.6 A 10 10 0 0 1 15.4 70 A 10 10 0 0 1 10 50 A 10 10 0 0 1 15.4 30 A 10 10 0 0 1 30 15.3 A 10 10 0 0 1 50 10 Z" fill="#CDD3B4" stroke="#3A4A2C" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="paw-icon">
        <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="45" cy="45" r="40" fill="#3A4A2C" />
          <line x1="75" y1="75" x2="96" y2="96" stroke="#3A4A2C" stroke-width="14" stroke-linecap="round" />
          <path d="M 22 18 L 33 30 C 40 26, 50 26, 57 30 L 68 18 L 78 45 C 80 65, 65 75, 45 75 C 25 75, 10 65, 12 45 Z" fill="#F5F6EE" />
          <ellipse cx="32" cy="46" rx="4" ry="7" fill="#3A4A2C" />
          <ellipse cx="58" cy="46" rx="4" ry="7" fill="#3A4A2C" />
          <path d="M 42 55 L 48 55 L 45 59 Z" fill="#3A4A2C" />
          <path d="M 38 63 Q 41.5 67 45 62 Q 48.5 67 52 63" stroke="#3A4A2C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
    
    <button class="btn-main" id="btn-start" style="line-height: 1.2; padding: 16px 20px;">
      <span style="font-size: 20px; font-weight: bold; display: block; margin-bottom: 6px;">今天会遇见谁呢？</span>
      <span style="font-size: 13px; font-weight: 500; opacity: 0.85;">上传照片 / 拍照</span>
    </button>
    
    <div class="home-foot">
      <div class="stat">已收录 <b id="stat-count">0</b> 只动物伙伴</div>
      <button class="link-btn" id="btn-gallery">我的动物图鉴 →</button>
    </div>
  </section>

  <section id="view-analyzing" class="view">
    <div class="scan-wrap">
      <img id="scan-img" alt="">
      <div class="scan-line"></div>
    </div>
    <div class="analyzing-text">
      <span class="dot-pulse"></span>
      <span id="analyzing-msg">正在准备手账…</span>
    </div>
  </section>

  <section id="view-result" class="view">
    <div class="result-head" style="display: flex; align-items: center; justify-content: space-between; padding: 30px 0 16px;">
      <button class="back-btn" id="btn-back-result" style="padding: 0; font-size: 14.5px; font-weight: 600; color: var(--ink2); cursor: pointer; border: none; background: none; font-family: inherit;">← 返回</button>
      <span class="task-chip done" id="result-status-chip">✓ 记录完成</span>
    </div>
    
    <div class="photo-card">
      <img id="result-img" alt="">
      <div class="photo-stamp">已遇见</div>
      <button id="btn-change-photo" style="position: absolute; left: 14px; bottom: 14px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); color: var(--orange); font-size: 12.5px; font-weight: 800; letter-spacing: .05em; padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--orange); cursor: pointer; transition: all 0.2s;">更换照片</button>
    </div>
    
    <div style="text-align: right; margin-top: 8px;">
      <button id="btn-download" style="background: none; border: none; color: var(--ink2); font-size: 13px; font-family: inherit; cursor: pointer; text-decoration: underline; border-bottom: 1px dashed var(--line);">保存这张照片</button>
    </div>

    <div class="breed-card" style="padding: 20px; margin-top: 12px;">
      <div class="breed-label" style="margin-bottom: 8px;">这是谁？</div>
      <input class="text-input" id="animal-name" placeholder="比如：三花猫、小黑狗、大熊猫…" maxlength="12" style="margin-top: 0; font-size: 18px; font-weight: bold;">
      <div style="font-size: 12px; color: var(--ink2); margin-top: 8px; opacity: 0.7;">随心记录</div>
    </div>

    <div class="section-title">
      <div class="hand-checkbox" id="check-location">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">在哪里遇见？</span>
      </div>
    </div>
    <div class="chip-row" id="location-chips"></div>
    <input class="text-input" id="location-input" placeholder="或者，自己填一个地点…" maxlength="20">

    <div class="section-title">
      <div class="hand-checkbox" id="check-personality">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">它的性格</span>
      </div>
      <button class="refresh-btn" id="btn-refresh-personality" style="margin-left: auto; background: none; border: none; color: var(--orange); font-size: 13px; cursor: pointer;">换一批</button>
    </div>
    <div class="chip-row" id="personality-chips"></div>
    <div class="input-with-btn">
      <input class="text-input" id="personality-input" placeholder="输入你想加的词…" maxlength="16">
      <button class="add-btn" id="btn-add-personality" type="button">+ 添加</button>
    </div>

    <div class="section-title">
      <div class="hand-checkbox" id="check-voice">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">它的声音</span>
      </div>
      <button class="refresh-btn" id="btn-refresh-voice" style="margin-left: auto; background: none; border: none; color: var(--orange); font-size: 13px; cursor: pointer;">换一批</button>
    </div>
    <div class="chip-row" id="voice-chips"></div>
    <div class="input-with-btn">
      <input class="text-input" id="voice-input" placeholder="输入你想加的词…" maxlength="16">
      <button class="add-btn" id="btn-add-voice" type="button">+ 添加</button>
    </div>

    <div class="section-title">
      <div class="hand-checkbox" id="check-appetite">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">饭量如何？</span>
      </div>
      <button class="refresh-btn" id="btn-refresh-appetite" style="margin-left: auto; background: none; border: none; color: var(--orange); font-size: 13px; cursor: pointer;">换一批</button>
    </div>
    <div class="chip-row" id="appetite-chips"></div>
    <div class="input-with-btn">
      <input class="text-input" id="appetite-input" placeholder="输入你想加的词…" maxlength="16">
      <button class="add-btn" id="btn-add-appetite" type="button">+ 添加</button>
    </div>

    <div class="section-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#465B36" style="vertical-align: -3px; margin-right: 2px;" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span class="text">初见印象以及你最爱的特征</span>
      <button class="refresh-btn" id="btn-refresh-vibe" style="margin-left: auto; background: none; border: none; color: var(--orange); font-size: 13px; cursor: pointer;">换一批</button>
    </div>
    <div class="chip-row" id="vibe-chips"></div>
    <div class="input-with-btn">
      <input class="text-input" id="vibe-input" placeholder="输入你想加的词…" maxlength="16">
      <button class="add-btn" id="btn-add-vibe" type="button">+ 添加</button>
    </div>

    <div class="section-title">
      <div class="hand-checkbox" id="check-notes">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M 4 12 L 10 18 L 20 5" /></svg></span>
        <span class="text">你想对 TA 说的话</span>
      </div>
    </div>
    <div id="notes-history" class="notes-history-box" style="display: none;"></div>
    <input class="text-input" id="notes-input" placeholder="在这里写下新的话…" maxlength="50">

    <div id="history-panel" style="display: none; margin-top: 20px; padding: 15px; background: var(--white); border: 1.5px dashed var(--line); border-radius: 12px;">
      <div style="font-size: 13px; font-weight: bold; color: var(--orange); margin-bottom: 8px;">这只伙伴的修改记录：</div>
      <ul id="history-list" style="padding-left: 16px; font-size: 12px; color: var(--ink2); line-height: 1.8;"></ul>
    </div>

    <button class="btn-main floating-save" id="btn-save">收进图鉴</button>

    <div style="margin-top: 50px; margin-bottom: 80px; text-align: center;">
      <button id="btn-again" style="background: none; border: none; color: var(--ink2); font-size: 14px; font-family: inherit; cursor: pointer; text-decoration: underline; opacity: 0.7;">放弃当前内容并开启新图鉴</button>
    </div>
  </section>

  <section id="view-gallery" class="view">
    <button class="back-btn" id="btn-back">← 返回</button>
    <h2 class="gallery-title">我的动物图鉴</h2>
    <div class="gallery-sub" id="gallery-sub">还没有记录</div>
    
    <div class="corkboard-wrap" id="corkboard-wrap">
      <div class="corkboard-track" id="corkboard-track"></div>
    </div>

    <div class="gallery-list" id="gallery-list"></div>
  </section>
</div>

<!-- 🌟 底部装饰图。注意：你需要在文件夹里放入真实的图片，并重命名为对应的名字。如果没有图片，它不会加载，但也不影响页面使用了。 -->
<img src="plant.png" class="deco-bottom deco-left" alt="">
<img src="cat.png" class="deco-bottom deco-right" alt="">

<input type="file" id="file-input" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script src="breeds.js"></script>
<script src="app.js"></script>
</body>
</html>
